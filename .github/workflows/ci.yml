name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Swift ${{ matrix.swift }} / GRDB ${{ matrix.grdb }}
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        # GRDB >= 7.9 requires Swift tools 6.1; package pins GRDB 7.10+
        swift: ["6.1"]
        grdb: ["7.10.0", "7.11.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 16.3+ ships Swift 6.1; latest-stable on macos-15 is sufficient
          xcode-version: latest-stable

      - name: Pin GRDB version
        run: |
          # 修改 Package.resolved 中的 GRDB 版本，测试指定版本
          RESOLVED=Package.resolved
          GRDB_VERSION="${{ matrix.grdb }}"
          if [ -f "$RESOLVED" ]; then
            python3 - <<EOF
          import json, sys
          with open("$RESOLVED") as f:
              data = json.load(f)
          for pin in data.get("pins", []):
              if "groue/GRDB.swift" in pin.get("location", ""):
                  pin["state"]["version"] = "$GRDB_VERSION"
                  pin["state"].pop("branch", None)
                  pin["state"].pop("revision", None)
          with open("$RESOLVED", "w") as f:
              json.dump(data, f, indent=2)
          EOF
          fi

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c release

      - name: Run tests with code coverage
        run: swift test --parallel --enable-code-coverage

      - name: Report Code Coverage
        if: always()
        run: |
          bash scripts/coverage.sh --skip-test --check-threshold 90 > coverage_report.txt
          echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY


